[package]
name = "rsgui-decision-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bounded Rust decisions for the rsgui desktop executor"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

